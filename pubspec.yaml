name: finansa_new
description: "Aplikasi Manajemen Keuangan Berbasis Psikologi Finansial"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.9
  sqflite: ^2.3.2
  path: ^1.8.3
  fl_chart: ^0.66.2
  lottie: ^3.0.0
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_analytics: ^11.3.3
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

# ← Ini harus di luar blok flutter:
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/finansa-logo.png"
  min_sdk_android: 26
  adaptive_icon_background: "#4527A0"
  adaptive_icon_foreground: "assets/images/finansa-logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/